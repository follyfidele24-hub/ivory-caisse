name: Construire l'APK Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: APK installable
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Installer les dépendances
        run: npm ci

      - name: Construire l'application web
        run: npm run build

      - name: Créer le projet Android
        run: npx cap add android

      - name: Normaliser les ressources mobiles
        run: node scripts/prepare-assets.mjs

      - name: Générer l'icône et le splash
        run: npx capacitor-assets generate --android

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Construire l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ivory-caisse-beta.apk

      - name: Publier l'APK à télécharger
        uses: actions/upload-artifact@v4
        with:
          name: ivory-caisse-android-apk
          path: ivory-caisse-beta.apk
          if-no-files-found: error
          retention-days: 30

      - name: Créer une version bêta téléchargeable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-beta-${{ github.run_number }}
          name: Ivory Caisse Android — bêta ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: ivory-caisse-beta.apk