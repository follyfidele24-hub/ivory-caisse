<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Page introuvable · Ivory Caisse</title>
    <meta name="theme-color" content="#f6f7fa" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <style>
      :root{color-scheme:light;font-family:Inter,system-ui,sans-serif;background:#f6f7fa;color:#141a33}
      *{box-sizing:border-box}body{margin:0;line-height:1.55}
      main{max-width:560px;margin:auto;padding:64px 22px}
      .logo{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none;font-weight:800;margin-bottom:48px}
      .ledger{background:#fff;border:1px solid #dfe3ec;border-radius:18px;padding:6px 20px;margin:28px 0}
      .row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #e6e9f0}
      .row:last-child{border:0;font-weight:800}
      .m{color:#c8173f;font-weight:700}
      h1{font-size:clamp(2rem,8vw,3rem);line-height:1.02;margin:0 0 12px;letter-spacing:-.02em}
      p{color:#59607a;margin:0}
      .cta{display:inline-block;margin-top:8px;padding:15px 22px;border-radius:14px;background:#c8490d;color:#fff;text-decoration:none;font-weight:800}
      .alt{display:block;margin-top:16px;color:#141a33}
    </style>
  </head>
  <body>
    <main>
      <a class="logo" href="/"><img src="/icons/icon.svg" alt="" width="40" height="40" />Ivory Caisse</a>
      <h1>Cette page n'est pas dans le cahier.</h1>
      <p>Le lien est peut-être incomplet, ou la page a changé d'adresse.</p>
      <div class="ledger" aria-hidden="true">
        <div class="row"><span>Page demandée</span><span class="m">introuvable</span></div>
        <div class="row"><span>Retour à la caisse</span><span>1 touche</span></div>
      </div>
      <a class="cta" href="/">Ouvrir Ivory Caisse</a>
      <a class="alt" href="/support.html">Besoin d'aide ? Contact et support</a>
    </main>
  </body>
</html>
