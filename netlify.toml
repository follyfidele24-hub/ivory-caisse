# ============================================================
#  Ivory Caisse — configuration Netlify (fusion existant + kit Thanos v3.1)
#  /            → landing statique (public/index.html)
#  /app/        → SPA (dist/app/)
#  /api/*       → Netlify Functions (chemins déclarés dans chaque fonction)
#  Source unique des en-têtes : ce fichier (public/_headers supprimé).
# ============================================================

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ---------- 1. Redirections ----------

# Retour de paiement : /api/pay/return renvoie vers /?paiement=retour&tx=…
# (fonction inchangée). On aiguille vers l'app pour que la vérification tourne.
[[redirects]]
  from = "/"
  to = "/app/?paiement=retour&tx=:tx"
  status = 302
  force = true
  query = { paiement = "retour", tx = ":tx" }

[[redirects]]
  from = "/"
  to = "/app/?paiement=retour"
  status = 302
  force = true
  query = { paiement = "retour" }

# Existant — conservé tel quel
[[redirects]]
  from = "/compteur"
  to = "/stats.html"
  status = 200
  force = true

[[redirects]]
  from = "/apk"
  to = "/ivory-caisse.apk"
  status = 302
  force = true

[[redirects]]
  from = "/android"
  to = "/apk"
  status = 301
  force = true

[[redirects]]
  from = "/telecharger"
  to = "/apk"
  status = 301
  force = true

# Kit — page compteur et SPA
[[redirects]]
  from = "/stats"
  to = "/stats.html"
  status = 200

# L'app garde ses URL au rechargement (fichiers existants servis en priorité)
[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

# Kit — anciennes URL → ancres de la landing (301 pour le SEO)
[[redirects]]
  from = "/tarifs"
  to = "/#tarifs"
  status = 301

[[redirects]]
  from = "/pricing"
  to = "/#tarifs"
  status = 301

[[redirects]]
  from = "/faq"
  to = "/#faq"
  status = 301

# ---------- 2. En-têtes ----------

[[headers]]
  for = "/*"
  [headers.values]
    # TODO(domaine) : remettre "; preload" seulement avec un domaine propre.
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    # CSP stricte (option B). 'unsafe-inline' requis : la landing embarque son script.
    # Sauvegarde cloud Firebase : ajouter à connect-src, le jour où elle sort :
    #   https://*.googleapis.com https://*.firebaseio.com https://*.firebase.com wss://*.firebaseio.com
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: blob:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://wa.me; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/app/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

# Existant — conservé : téléchargement direct, jamais de version périmée
[[headers]]
  for = "/ivory-caisse.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=ivory-caisse.apk"
    Cache-Control = "no-cache"
    X-Robots-Tag = "noindex"
